NITC: true
nitc_loss_weight: 1.0

MVS: true
nitc_mvs_mode: baseline  # baseline preserves the 52.28 recipe; direct uses aug_images_features in N-ITC

CIR: true
circle_loss_weight: 0.1
circle_margin: 0.25
circle_gamma: 128

CITC: true
citc_inmodal_weight: 0.25
citc_intermodal_weight: 0.25
citc_loss_weight: 0.1

SS: true
simclr_temperature: 0.1
ss_loss_weight: 0.4

PART_ALIGN: false
part_align_loss_weight: 0.05
part_align_temperature: 0.07
part_align_num_parts: 4
part_align_warmup_epoch: 5
part_align_ramp_epoch: 15

# Multilingual Noise Evidence Bank for Hard-Negative TBPS (MNEB-HN)
# Disabled by default. When enabled, the vanilla Circle branch remains intact;
# FN/FP correction is added only through auxiliary losses.
MNEB: false

mneb_config:
  evidence_bank:
    enabled: true
    queue_size: 4096
    topk: 20
    ema_beta: 0.99
    loss_ema_alpha: 0.9
    min_seen_epochs: 3
    min_gmm_samples: 50
    gmm_interval: 5
    min_gmm_separation: 1.0
    clean_threshold: 0.5
  fnm_aux:
    enabled: false
    weight: 0.05
    enable_epoch: 15
    temperature: 0.07
    margin: 0.25
    theta_fn: 0.8
    fn_prior: 0.003
    max_candidate_frac: 0.02
    min_pos_neg_gap: 0.0
    local_agreement: true
  rde_aux:
    enabled: false
    weight: 0.05
    enable_epoch: 15
    margin: 0.2
    temperature: 0.07
    uncertain_policy: "no_op"

# Noise-Aware Circle Loss (Idea C — FP-noise handling by default)
# When NACIR is true, the regular CIR branch is skipped in tbps.py.
# Reuses the same circle_loss_weight / circle_margin / circle_gamma as CIR.
NACIR: false

nacir_config:
  # FN detection is off by default because it can weaken Circle hard-negative mining
  # on clean VN3K. Use mutual_topk/bayesian only for explicit FN ablations.
  fn_detector: "off"  # options: off, mutual_topk, bayesian
  ema_beta: 0.99
  fn_prior: 0.003
  epsilon_n: 0.85
  fn_safe_gate: true
  fn_prob_threshold: 0.80
  fn_pos_sigma_k: 1.0
  fn_max_suppress_frac: 0.05
  fn_min_pos_neg_gap: 0.0
  fn_mutual_topk: 2
  fn_mutual_min_sim: -1.0
  # Per-sample loss tracking (for GMM-based FP detection on the positive branch)
  loss_ema_alpha: 0.9
  epsilon_p: 0.2
  gmm_refit_interval: 5
  gmm_min_separation: 1.0
  # Curriculum epoch gates for detector activation.
  # FN is disabled by default; FP turns on later because GMM needs history.
  fn_enable_epoch: 999
  fp_enable_epoch: 15
